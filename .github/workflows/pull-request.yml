name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify generated Xcode project
        run: |
          python3 scripts/create-project.py
          git diff --exit-code -- ColorFlow.xcodeproj
      - name: Run core tests
        run: swift test -c release
      - name: Audit published levels
        run: swift run -c release LevelCheck
      - name: Test device selection
        run: python3 scripts/test_device_selection.py

  ios-build-and-tests:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build Release for iOS
        run: |
          xcodebuild -project ColorFlow.xcodeproj -scheme ColorFlow \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Create compact simulator
        run: |
          simulator_id=$(xcrun simctl create 'Color Flow CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "SIMULATOR_UDID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Run all UI tests
        run: python3 scripts/run-tests.py
      - name: Upload simulator test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
